{
  "services": [
    {
      "type": "web",
      "name": "novastore-backend",
      "env": "node",
      "buildCommand": "cd backend && npm install",
      "startCommand": "cd backend && node server.js",
      "envVars": [
        { "key": "NODE_ENV", "value": "production" },
        { "key": "PORT", "value": "5000" },
        { "key": "MONGO_URI", "sync": false },
        { "key": "JWT_SECRET", "sync": false },
        { "key": "JWT_EXPIRE", "value": "30d" },
        { "key": "STRIPE_SECRET_KEY", "sync": false },
        { "key": "FRONTEND_URL", "sync": false }
      ]
    }
  ]
}
